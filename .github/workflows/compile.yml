name: Compile ATLANTA-RP

on:
  push:
    branches: [ main ]
    paths:
      - "gamemodes/**"
      - "qwano/include/**"
      - ".github/workflows/compile.yml"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PAWNCC_VERSION: "v3.10.10"
  GAMEMODE_ENTRY: "gamemodes/atrp.pwn"
  GAMEMODE_OUTPUT: "gamemodes/atrp.amx"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download community pawncc (Linux)
        run: |
          mkdir -p pawncc
          curl -sSL -f -o pawncc.tar.gz \
            "https://github.com/pawn-lang/compiler/releases/download/${PAWNCC_VERSION}/pawnc-${PAWNCC_VERSION#v}-linux.tar.gz"
          tar -xzf pawncc.tar.gz -C pawncc --strip-components=1
          chmod +x pawncc/bin/pawncc

      - name: Compile gamemode
        run: |
          echo "Vérification du dossier includes :"
          ls "${GITHUB_WORKSPACE}/qwano/include" | head -5
          test -f "${GITHUB_WORKSPACE}/qwano/include/open.mp.inc" && echo "open.mp.inc trouvé" || echo "open.mp.inc INTROUVABLE"
          cd gamemodes
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/pawncc/lib:${GITHUB_WORKSPACE}/pawncc/bin:${LD_LIBRARY_PATH}"
          ../pawncc/bin/pawncc atrp.pwn \
            -i"${GITHUB_WORKSPACE}/qwano/include/" \
            -O2 -d3 -Z+ \
            -oatrp

      - name: Verify output
        run: |
          if [ ! -f "${GAMEMODE_OUTPUT}" ]; then
            echo "Compilation échouée : atrp.amx introuvable."
            exit 1
          fi
          echo "Compilation réussie : $(ls -lh ${GAMEMODE_OUTPUT})"

      - name: Upload compiled gamemode
        uses: actions/upload-artifact@v4
        with:
          name: atrp-amx
          path: ${{ env.GAMEMODE_OUTPUT }}
          retention-days: 14
